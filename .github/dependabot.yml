version: 2

updates:
  # Reads gradle/libs.versions.toml as well as the build files, including its
  # [plugins] block: a plugin there is named by its id, not by the module that
  # implements it.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # Two plugin ids, one `version.ref = "agp"`. Ungrouped they are two pull
      # requests editing the same catalogue line.
      agp:
        patterns:
          - com.android.application
          - com.android.library
      # `activity-ktx` and `activity-compose` share one version.ref, and the
      # Compose pattern below does not reach them: the group is androidx.activity,
      # not androidx.compose.
      activity:
        patterns:
          - androidx.activity:*
      # The BOM is the only Compose entry in the catalogue that carries a version
      # of its own, so today it is the only one Dependabot can propose at all.
      # The group exists so that stays true if an artifact ever gains one.
      compose:
        patterns:
          - androidx.compose*
      # `kotlin-android` and `kotlin-compose` share one version.ref on purpose:
      # the Compose compiler plugin ships in the Kotlin repository and has to
      # match it exactly. The trailing dot matters. `org.jetbrains.kotlin*` also
      # matches org.jetbrains.kotlinx.binary-compatibility-validator, which keeps
      # its own version and no relationship to the Kotlin release train, and
      # welding the two together makes a pull request where neither half can land
      # alone.
      kotlin:
        patterns:
          - org.jetbrains.kotlin.*
    ignore:
      # AGP 9 needs Gradle 9.6 or newer, and AGP 8.x reads an internal API that
      # Gradle 9.6 removed, so neither can move first: it is a migration done by
      # hand, in one commit, or not at all.
      #
      # Named by plugin id, because that is how a catalogue declares AGP. The
      # module coordinate `com.android.tools.build:gradle` appears nowhere in this
      # project, and an `ignore` that matches nothing is not an error: it is a
      # silent no-op that leaves the cap unguarded.
      #
      # A version range rather than `update-types: semver-major`, for two reasons.
      # It expires by itself once 9 is taken, where a major-version ban would go
      # on suppressing 10 and 11 with nothing left to explain why. And `ignore`
      # applies to security updates as well as version updates, so a blanket major
      # ban would also hide a major-version security fix.
      - dependency-name: com.android.application
        versions: ['>= 9']
      - dependency-name: com.android.library
        versions: ['>= 9']
      # The same chain reaches the Compose BOM, which is not obvious until a build
      # fails on it. 2026.09.00 brings `foundation-android` 1.12.1, which requires
      # compileSdk 37; 37 needs an AGP that supports it, which is AGP 9, which needs
      # Gradle 9.6. So the BOM cannot move until the two above do, and a weekly pull
      # request that cannot build is worse than none. Lift all three together.
      - dependency-name: androidx.compose:compose-bom
        versions: ['>= 2026.09.00']

  # Pinned by commit SHA here, every one of them, so a pin cannot move unless
  # something opens a pull request to move it. Dependabot rewrites the trailing
  # `# vX.Y.Z` comment along with the SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
