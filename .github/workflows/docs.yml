name: API documentation

# **This file has to be in the tagged commit**, exactly as `release.yml` says of
# itself: a run uses the workflow present at the ref the event carries, and for a
# release that ref is the tag. `CONTRIBUTING.md` carries it as a release step, and
# an earlier version of this comment claimed the opposite.
#
# Two repository settings this depends on and cannot set for itself. Both are in
# place; they are written down because nothing in the build fails if one is undone,
# and a fork starts with neither:
#
#   1. Pages enabled with "GitHub Actions" as the source. `configure-pages` offers
#      an `enablement` input that cannot help here, by its own description: "This
#      option requires a token other than GITHUB_TOKEN". Enabling goes through
#      `administration:write`, which is not in the `permissions:` vocabulary at all.
#   2. The `github-pages` environment allowed to deploy from a tag, which is the
#      `tag: *` rule beside the default-branch one. GitHub creates that environment
#      limited to the default branch, and a release run's ref is a tag, so without
#      the rule the deploy is refused with `Branch "0.2.0" is not allowed to deploy
#      to github-pages`, naming a branch for a tag and sending you to the wrong
#      place.
on:
  # The tag push, not `release: published`. `release.yml` creates the release now,
  # and a release created by anything authenticating as GITHUB_TOKEN raises no
  # event, so waiting on one here would mean the docs silently stopped publishing
  # the moment release creation was automated.
  push:
    tags: ['[0-9]*']
  # A manual run publishes whichever ref is chosen, pinning the source links to that
  # ref rather than to a release. It is how to prove the setup without cutting a
  # release, and the only path that works if the tag rule above is ever removed.
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, never cancelled halfway: a cancelled deploy can leave
# the site on a half-written commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Whether this ref should become the published site at all, which is a
  # question only a tag push raises. The site holds one version and keeps no
  # history, so a backport tag pushed after a newer release would replace the
  # current reference with an older one.
  #
  # Decided against the tags, where `release.yml` decides from the releases.
  # Not the same source and so not always the same answer: both workflows run
  # on this push, so the release object may not exist yet when this reads it,
  # while the tag ruleset makes tags immutable and therefore readable now. The
  # cost of the difference is that a tag whose release was refused still counts
  # here, and until it is removed through the admin bypass the site stays where
  # it is. A manual run republishes in the meantime.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.newest.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          # Every tag, because the comparison is against all of them.
          fetch-depth: 0
          persist-credentials: false

      - id: newest
        env:
          TAG: ${{ github.ref_name }}
          # The event, not the shape of the ref. `workflow_dispatch` can be run
          # on a tag, and gating that on the ref would remove the one path that
          # republishes an older ref deliberately.
          IS_TAG_PUSH: ${{ github.event_name == 'push' }}
        run: |
          set -eu
          if [ "$IS_TAG_PUSH" != "true" ]; then
            echo "A manual run publishes whatever ref it was given, here $TAG."
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          declared=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if [ "$declared" != "$TAG" ]; then
            echo "Tag $TAG disagrees with VERSION_NAME=$declared in gradle.properties." >&2
            echo 'Nothing has been published. See CONTRIBUTING.md, "Cutting a release".' >&2
            exit 1
          fi
          # Plain X.Y.Z only. The trigger's `[0-9]*` also matches `0.3.0-rc1`
          # and `2024-backup`, and `sort -V` ranks `0.3.0-rc1` above `0.3.0`,
          # so either would sit at the top of this list for good. A side effect
          # worth knowing: a pre-release tag is never the newest by this test,
          # so it publishes no documentation and leaves the stable reference up.
          newest=$(git tag --list | grep -xE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          if [ "$newest" != "$TAG" ]; then
            # Said where a reader looks. Skipped and refused both leave the
            # deploy unrun, and only this separates them from the Actions tab.
            echo "::notice title=Documentation unchanged::$TAG is behind $newest, so the site stays on $newest."
            echo "\`$TAG\` is behind \`$newest\`, so the published reference stays on \`$newest\`." \
              >> "$GITHUB_STEP_SUMMARY"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

  publish:
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # `contents` stays read: this pushes nothing to the repository, so unlike
      # `release.yml` there is no write token to keep off the disk.
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Generate
        env:
          # Through the environment and quoted at the point of use, for the reason
          # `release.yml` gives: `${{ }}` is substituted into the script text before
          # bash sees it, and `git check-ref-format` accepts `$(`, backticks, `;`
          # and `&&` in a ref name.
          REF: ${{ github.ref_name }}
        run: ./gradlew :hardware-insets:dokkaGeneratePublicationHtml "-PdokkaSourceRef=$REF" --stacktrace

      - name: The site documents this ref
        env:
          REF: ${{ github.ref_name }}
        # Not a check that Dokka ran, which its exit status already proved. Dokka
        # writes a 10KB index.html carrying 446 characters of text even when it
        # documents nothing, so file existence asserts almost nothing. These two
        # assert the feature: that declarations have pages, and that their source
        # links point at the ref being published rather than at whatever a cached
        # earlier run pinned.
        run: ./.github/scripts/check-docs.sh hardware-insets/build/dokka/html "$REF"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: hardware-insets/build/dokka/html

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
