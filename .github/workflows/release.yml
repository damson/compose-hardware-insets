name: Release artifacts

# On the tag being pushed, and this workflow creates the release itself.
#
# It used to run on `release: published`, which meant a human created the release
# for this to react to. That had two costs. The guard below could only ever report
# a version mismatch, because the release already existed by the time it ran. And
# a release created by anything authenticating as GITHUB_TOKEN raises no event at
# all, so the old shape could never be automated: whoever automated it would have
# silently lost the attachment.
#
# Triggering both this and `docs.yml` on the tag push removes that whole class.
# Neither waits on an event the other produces, so neither can be starved of one.
#
# **This file still has to be in the tagged commit.** A run uses the workflow
# present at the ref the event carries, and for a tag push that ref is the tag.
# Tags here are cut on `main`, which is the only long-lived branch, so that is now
# true by construction rather than by procedure.
#
# The pattern matches a leading digit, so `0.3.0` runs and a throwaway ref like
# `scratch` does not.
on:
  push:
    tags: ['[0-9]*']

# Uploading is not a thing to cancel halfway, so the group serialises publishes
# without cancel-in-progress: two near-simultaneous ones would otherwise race
# each other through `--clobber`.
#
# Keyed by tag on purpose, having been workflow-wide briefly. A shared group
# would serialise two tags published at once, which closes a narrow race on the
# latest-release decision below, and it opens a worse hole: GitHub keeps one
# pending run per group and cancels the previous pending one when a newer
# arrives, whatever `cancel-in-progress` says. Three tags in quick succession
# would lose the middle one's release entirely, and a tag cannot be re-pushed.
#
# So the race is accepted. It needs two tags inside the seconds between reading
# the latest release and creating one, both of them newer than it, and it costs
# a wrong Latest badge that `gh release edit --latest` fixes. A lost release
# costs the release. `queue: max` would allow both, once it is confirmed
# available here; it is not worth finding out on a path that only runs on a tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

# Read-only here so a second job added later inherits this rather than the
# repository default. The one job that writes says so itself.
permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The only job in this repository that writes.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `ref:` needed: a tag push already checks out the tag, which is the
          # one commit a release is a statement about.
          # Without this, checkout leaves this job's token in .git/config as an
          # extraheader, and the next step runs the whole Gradle plugin graph,
          # unverified, with that file readable. The token here can write to the
          # repository, so a compromise anywhere upstream would escalate from a
          # bad release asset to a push. Nothing needs the persisted credential:
          # the upload takes the token explicitly.
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: The tag and the declared version agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          declared=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          # Compared exactly, with no `v` stripped. JitPack's coordinate *is* the
          # tag, so a `v0.3.0` tag is served as version `v0.3.0` while the files
          # here would say `0.3.0` and the README documents neither.
          if [ "$declared" != "$TAG" ]; then
            cat >&2 <<MSG
          Tag $TAG disagrees with VERSION_NAME=$declared in gradle.properties.

          Nothing has been published: this runs before the release is created, so
          the tag is the only thing to undo. Fix VERSION_NAME, or re-cut the tag
          on a commit that declares $TAG. See CONTRIBUTING.md, "Cutting a
          release".
          MSG
            exit 1
          fi
          printf 'VERSION=%s\n' "$declared" >> "$GITHUB_ENV"

      - name: The same gates a pull request passes
        # A release can be cut from any commitish the release UI offers, including
        # one that never went through a pull request, so this is the only thing
        # standing between an untested tree and a published artifact.
        run: ./gradlew check apiCheck koverVerify :hardware-insets:koverVerify --stacktrace

      - name: Build the library and the sample
        # publishToMavenLocal rather than assembleRelease: it writes the aar, the
        # sources jar, the pom and the Gradle metadata under one versioned
        # directory with stable names, where assembleRelease leaves the sources jar
        # in an intermediates path that moves between AGP versions.
        run: ./gradlew :hardware-insets:publishToMavenLocal :sample:assembleDebug --stacktrace

      - name: Collect them, and fail on anything missing
        run: |
          set -eu
          out=artifacts
          mkdir -p "$out"
          m2="$HOME/.m2/repository/com/devddagnet/hardware-insets/$VERSION"
          # The pom and the module metadata go too. Without them the aar records
          # none of its api dependencies, so anyone who drops it into libs/ gets
          # unresolved Compose symbols and no way to find out why.
          for f in \
            "hardware-insets-$VERSION.aar" \
            "hardware-insets-$VERSION-sources.jar" \
            "hardware-insets-$VERSION.pom" \
            "hardware-insets-$VERSION.module" ; do
            cp "$m2/$f" "$out/"
          done
          # The sample ships debug-signed, which is what makes it installable
          # without the reader generating a key. Its release build is unsigned on
          # purpose and is published nowhere.
          cp sample/build/outputs/apk/debug/sample-debug.apk \
             "$out/hardware-insets-sample-$VERSION.apk"
          # An empty file uploads as happily as a real one, and reads as a corrupt
          # download rather than as a broken build.
          for f in "$out"/*; do
            [ -s "$f" ] || { echo "$f is empty" >&2; exit 1; }
          done
          ls -l "$out"

      - name: The notes this version ships with
        run: |
          set -eu
          # The changelog section for this version, which is the only place the
          # notes are written. An empty extract means the changelog was not
          # updated, and shipping a release with no notes is worse than stopping.
          awk -v v="$VERSION" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > notes-body.md
          # Tested for a non-whitespace character rather than for size: a
          # heading followed by a blank line and then the next heading extracts
          # one newline, which is a non-empty file and no notes at all.
          grep -q '[^[:space:]]' notes-body.md || {
            echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
          {
            printf '```kotlin\nimplementation("com.github.damson:compose-hardware-insets:%s")\n```\n' "$VERSION"
            cat notes-body.md
          } > notes.md
          wc -l notes.md

      - name: Publish the release with its artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Given the files, `gh release create` holds the release as a draft
        # until every one has uploaded and publishes it only then. Creating
        # first and uploading after would leave a published release carrying no
        # assets behind any upload that failed, and nothing would say so.
        #
        # An existing release is the re-run path, where --clobber replaces the
        # assets rather than failing on a name already taken.
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          # Latest is decided here rather than left to a default. Passed
          # unconditionally, --latest makes a 0.2.1 backport cut after 0.3.0 the
          # latest release, pointing the latest-release link at the older version
          # line. It is passed explicitly either way, so what the default would
          # have been does not come into it.
          # A failed read must not look like "no releases yet". Swallowing the
          # error there would make a backport the latest release on a transient
          # 5xx, which is the one thing this is here to stop.
          set +e
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>err.txt)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -q '404' err.txt; then
              previous=
            else
              echo "Could not read the latest release:" >&2
              cat err.txt >&2
              echo "Refusing to guess whether $TAG is the latest release." >&2
              exit 1
            fi
          fi
          # Compared against released versions only, and only plain X.Y.Z ones:
          # `sort -V` puts `0.3.0-rc1` after `0.3.0`, so a pre-release left in
          # the list would make every final release look like a backport.
          if [ -z "$previous" ] \
             || ! printf '%s\n' "$previous" | grep -qxE '[0-9]+\.[0-9]+\.[0-9]+' \
             || [ "$(printf '%s\n%s\n' "$previous" "$TAG" | sort -V | tail -1)" = "$TAG" ]; then
            latest=true
          else
            latest=false
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file notes.md --latest="$latest" \
            artifacts/*
