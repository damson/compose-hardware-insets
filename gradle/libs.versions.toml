[versions]
# Nothing is capped. If a version has to be held back, say why on the line itself,
# so the next person raising it knows what they are taking on, and add the matching
# `ignore` to .github/dependabot.yml so it stops arriving weekly.
agp = "9.4.1"
kotlin = "2.4.20"
binaryCompatibility = "0.18.2"
kover = "0.9.11"
dokka = "2.2.0"

activity = "1.13.0"
# Held, and not for this repository's sake: 2026.09.00 brings foundation-layout
# 1.12.1, which declares `minCompileSdk=37` and AGP 9.1, and this library exports
# Compose as `api`, so both land on every consumer. Nothing here uses an API past
# 30. Raise it when requiring compileSdk 37 of consumers is acceptable, which
# issue #39 holds the threshold for.
composeBom = "2026.06.01"
# Held with the Compose line: 1.19.1 declares `minCompileSdk=37` and AGP 9.1 too,
# so raising it alone reimposes exactly what holding Compose avoids.
coreKtx = "1.18.0"

assertj = "3.27.7"
junit = "4.13.2"
robolectric = "4.17"

[libraries]
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-foundation-layout = { module = "androidx.compose.foundation:foundation-layout" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-core = { module = "androidx.test:core", version = "1.7.0" }

assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
binary-compatibility = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibility" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
