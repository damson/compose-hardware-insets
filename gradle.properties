org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The one place the released version is declared. Both modules read it and the
# release workflow compares it to the tag before it publishes anything, which it
# could not do while two build files each held their own copy.
VERSION_NAME=0.2.0

# AGP 9 applies Kotlin itself and refuses the Kotlin plugin alongside it. Off here,
# because binary-compatibility-validator registers `apiCheck` and `apiDump` by
# reacting to the Kotlin plugin being applied: under built-in Kotlin there is no
# plugin to react to, both tasks disappear, and `apiCheck` is a required status
# check. The build then passes by having nothing to check.
android.builtInKotlin=false
# And the new DSL with it: the Kotlin plugin refuses to apply alongside it, and
# AGP 9 turns it on by default. Both flags go when something else provides the API
# dump, or when the Kotlin plugin supports the new DSL.
android.newDsl=false
